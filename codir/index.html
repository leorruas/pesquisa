<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Apresentação indisponível | CODIR</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8faf8; color: #192820; font: 400 18px/1.5 system-ui, sans-serif; }
    main { width: min(100% - 48px, 640px); }
    p { margin: 0 0 16px; }
    .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: .13em; text-transform: uppercase; color: #26794a; }
    h1 { font-size: clamp(30px, 5vw, 48px); line-height: 1.1; margin: 0 0 20px; letter-spacing: -.04em; }
    .detail { color: #4f5c54; font-size: 16px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">IFMG / CODIR</p>
    <h1>Apresentação indisponível</h1>
    <p class="detail">O material desta apresentação foi retirado de circulação.</p>
  </main>
</body>
</html>
